<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munchr.io</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <canvas id="game"></canvas>

    <div id="hud">
        <div id="scorePanel"><span class="label">SIZE</span><span class="value" id="scoreVal">10</span></div>
        <div id="walletPanel"><span class="coinIcon">●</span><span class="value" id="walletVal">0</span></div>
    </div>

    <div id="leaderboard">
        <h3>Top players <span id="lbCount"></span></h3>
        <ol id="lbList"></ol>
    </div>

    <div id="overlay">
        <canvas id="bgWormCanvas"></canvas>
        <div class="neonBg">
            <span class="neonBlob b1"></span>
            <span class="neonBlob b2"></span>
            <span class="neonBlob b3"></span>
        </div>
        <div class="topBar">
            <div class="playerNameTag" id="topNameTag">Player</div>
            <div class="gemsPill">
                <span class="gemIcon">●</span>
                <span id="walletStart">0</span>
                <button type="button" class="addBtn" id="addCoinsBtn">+</button>
            </div>
        </div>

        <div class="menuCenter">
            <h1 class="logoText">Munchr<span class="dotIo">.io</span></h1>
            <p class="sub">Eat orbs. Grab powers. Avoid bigger blobs.</p>

            <input id="nameInput" type="text" placeholder="Your name" maxlength="12">

            <div id="skinPanel" class="panelCard">
                <div class="panelTitle">Choose your worm</div>
                <div id="skinRow"></div>
            </div>

            <button id="playBtn" class="battleBtn">
                <span class="battleShine"></span>
                TO BATTLE!
            </button>

            <p class="deathline" id="deathline"></p>
        </div>

        <div class="bottomBar">
            <button type="button" class="iconBtn" id="rankIconBtn">
                <span class="iconGlyph">🏆</span>
                <span class="iconLabel">Rank</span>
            </button>
            <button type="button" class="iconBtn" id="wardrobeIconBtn">
                <span class="iconGlyph">🎨</span>
                <span class="iconLabel">Wardrobe</span>
            </button>
            <button type="button" class="iconBtn" id="perksIconBtn">
                <span class="iconGlyph">⚡</span>
                <span class="iconLabel">Perks</span>
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>

</html>
